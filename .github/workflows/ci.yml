name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run --no-sync pytest -m "not integration"

  integration:
    name: Integration tests (PostgreSQL 15)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ja_pst
          POSTGRES_USER: ja_pst
          POSTGRES_PASSWORD: ja_pst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ja_pst"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JA_PST_DB_HOST: localhost
      JA_PST_DB_PORT: "5432"
      JA_PST_DB_NAME: ja_pst
      JA_PST_DB_USER: ja_pst
      JA_PST_DB_PASSWORD: ja_pst
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run integration tests
        run: uv run --no-sync pytest -m integration

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ja-pst-mcp:ci .
