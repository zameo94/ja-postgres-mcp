[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ja-pst-mcp"
version = "0.1.0"
description = "MCP server exposing PostgreSQL-backed tools for ja-pst."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = []
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ja_pst_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
