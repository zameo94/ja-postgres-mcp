[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ja-pst-mcp"
version = "0.1.0"
description = "MCP server exposing PostgreSQL-backed tools for ja-pst."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = []
dependencies = [
    "mcp>=2,<3",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
ja-pst-mcp = "ja_pst_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ja_pst_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: requires a PostgreSQL provisioned automatically by testcontainers",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = ["SIM117"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
ignore_missing_imports = true
