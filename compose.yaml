services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${JA_PST_DB_NAME:-ja_pst}
      POSTGRES_USER: ${JA_PST_DB_USER:-ja_pst}
      POSTGRES_PASSWORD: ${JA_PST_DB_PASSWORD:?set JA_PST_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ja-pst-mcp:
    build: .
    environment:
      JA_PST_DB_HOST: postgres
      JA_PST_DB_PORT: "5432"
      JA_PST_DB_NAME: ${JA_PST_DB_NAME:-ja_pst}
      JA_PST_DB_USER: ${JA_PST_DB_USER:-ja_pst}
      JA_PST_DB_PASSWORD: ${JA_PST_DB_PASSWORD:?set JA_PST_DB_PASSWORD in .env}
      JA_PST_SERVER_HOST: 0.0.0.0
      JA_PST_SERVER_PORT: "8000"
      JA_PST_ALLOWED_HOSTS: localhost:8000,127.0.0.1:8000,ja-pst-mcp:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
